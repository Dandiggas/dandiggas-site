<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@700&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; }
  body { background: #faf7f1; color: #171310; font-family: "Geist", system-ui, sans-serif; position: relative; overflow: hidden; }
  .eyebrow { position: absolute; left: 96px; top: 200px; font-family: "Geist Mono", monospace; font-size: 22px; letter-spacing: 0.25em; text-transform: uppercase; color: #b45309; }
  h1 { position: absolute; left: 92px; top: 240px; margin: 0; font-size: 96px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .rule { position: absolute; left: 96px; right: 96px; bottom: 120px; border-top: 2px solid rgba(42,37,31,.12); }
  .url { position: absolute; right: 96px; bottom: 64px; font-family: "Geist Mono", monospace; font-size: 24px; color: #6f6a60; }
  .tag { position: absolute; left: 96px; bottom: 64px; font-family: "Geist Mono", monospace; font-size: 20px; letter-spacing: 0.25em; text-transform: uppercase; color: #b45309; }
</style></head>
<body>
  <p class="eyebrow">Engineer · Musician</p>
  <h1>Dan Diggas</h1>
  <div class="rule"></div>
  <span class="tag">Keys open doors</span>
  <span class="url">tech.dandiggas.com</span>
</body></html>
